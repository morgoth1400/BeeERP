[tool.commitizen]
name = "cz_customize"

[tool.commitizen.customize]
message_template = "{{change_type}}({{scope}}): {{message}}"
schema = "<type>(<scope>): <description>"
schema_pattern = "^(feat|fix|refactor|test|docs|chore|build|ci)\\((docker|db|model|repository|service|schema|api|auth|frontend|dev|ci|docs)\\): .+$"

[[tool.commitizen.customize.questions]]
type = "list"
name = "change_type"
message = "Select the type of change"
choices = [
    { value = "feat", name = "feat: A new feature" },
    { value = "fix", name = "fix: A bug fix" },
    { value = "refactor", name = "refactor: Code restructuring" },
    { value = "test", name = "test: Tests" },
    { value = "docs", name = "docs: Documentation" },
    { value = "chore", name = "chore: Maintenance" },
    { value = "build", name = "build: Build system or dependencies" },
    { value = "ci", name = "ci: Continuous integration" }
]

[[tool.commitizen.customize.questions]]
type = "list"
name = "scope"
message = "Select the scope"
choices = [
    { value = "docker", name = "docker" },
    { value = "db", name = "db" },
    { value = "model", name = "model" },
    { value = "repository", name = "repository" },
    { value = "service", name = "service" },
    { value = "schema", name = "schema" },
    { value = "api", name = "api" },
    { value = "auth", name = "auth" },
    { value = "frontend", name = "frontend" },
    { value = "dev", name = "dev" },
    { value = "ci", name = "ci" },
    { value = "docs", name = "docs" }
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "message"
message = "Commit message"